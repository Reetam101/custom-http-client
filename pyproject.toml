[project]
name = "http-command-line-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reetam-1", email = "reetam.c@tedekstra.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "validators>=0.36.0",
]

[project.scripts]
http-command-line-tool = "http_command_line_tool:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
